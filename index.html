<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem vindo</title>
    <link rel="stylesheet" type="text/css" href="style/style.css">

</head>

<body>

   

    <div class="main-container">
  
        <!-- Contêiner do Logo -->
        <div class="card">
            <img src="imgs/casona_icon.png" alt="React Logo" class="App-logo" />
          <div class="header">Bem vindo(a) ao CasonaDig!</div>
        </div>
      
        <!-- Formulário de Login -->
        <form class="form-control" action="">
          <p class="title">Login</p>
          <div class="input-field">
            <input required="" class="input" type="text" />
            <label class="label" for="input">Digite sua matricula aqui</label>
          </div>
          <div class="input-field">
            <input required="" class="input" type="password" />
            <label class="label" for="input">Senha</label>
          </div>
          <button class="submit-btn">Acessar</button>
        </form>
        
      </div>

</body>

</html>
